<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 凤梨 — 黄化玄凤鹦鹉 -->

  <!-- Tail -->
  <path d="M42 72 L32 92 L40 80Z" fill="#F5E6A3"/>
  <path d="M50 74 L44 96 L51 82Z" fill="#FAF0C8"/>
  <path d="M58 72 L64 92 L56 80Z" fill="#F5E6A3"/>

  <!-- Body — warm cream -->
  <ellipse cx="50" cy="62" rx="24" ry="26" fill="#FEF9E7"/>

  <!-- Wing (folded) -->
  <path d="M64 52 Q78 66 72 82 Q66 72 60 62Z" fill="#FBF0D0"/>
  <path d="M36 52 Q22 66 28 82 Q34 72 40 62Z" fill="#FBF0D0"/>

  <!-- Head -->
  <circle cx="50" cy="38" r="18" fill="#FEF9E7"/>

  <!-- Crest — lutino yellow, clean shape -->
  <path d="M50 20 L44 28 L47 25 L50 32 L53 25 L56 28Z" fill="#F0D860"/>
  <path d="M50 18 L42 26 L48 24 L50 30 L52 24 L58 26Z" fill="#EECF4A"/>

  <!-- Orange cheeks — signature cockatiel -->
  <ellipse cx="40" cy="42" rx="5" ry="4" fill="#F4854A" opacity="0.9"/>
  <ellipse cx="60" cy="42" rx="5" ry="4" fill="#F4854A" opacity="0.9"/>

  <!-- Eyes -->
  <circle cx="41" cy="36" r="2.8" fill="#2D2D2D"/>
  <circle cx="59" cy="36" r="2.8" fill="#2D2D2D"/>
  <circle cx="42" cy="35" r="1" fill="white"/>
  <circle cx="60" cy="35" r="1" fill="white"/>

  <!-- Beak — soft pink -->
  <path d="M47 45 L50 50 L53 45" fill="#F0C0C0" stroke="#E8A8A8" stroke-width="0.6"/>

  <!-- Feet -->
  <g stroke="#F0C0C0" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M40 86 L38 93 M40 86 L41 93 M40 86 L43 93"/>
    <path d="M56 86 L54 93 M56 86 L57 93 M56 86 L59 93"/>
  </g>
</svg>
