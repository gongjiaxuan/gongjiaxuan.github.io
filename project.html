<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Jiaxuan Gong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--t:#374151;--th:#111827;--tm:#6b7280;--acc:#4f46e5;--as:#eef2ff;--bdr:#e5e7eb;--bg:#fff;--mw:768px;--f:'Inter',system-ui,sans-serif}
    body.dark{--t:#aaa;--th:#eee;--tm:#999;--acc:#818cf8;--as:#1e1b4b;--bdr:#2a2a2a;--bg:#111}
    body{font-family:var(--f);font-size:16px;line-height:1.5;color:var(--t);background:var(--bg);-webkit-font-smoothing:antialiased;font-weight:400}
    body.dark .back-nav{background:rgba(17,17,17,0.92);border-bottom-color:#222}
    body.dark .back-nav a{color:#999}
    body.dark .carousel{background:#000}
    body.dark .desc{color:#aaa}
    body.dark .tools{color:#777;border-bottom-color:#222}
    body.dark .tags span{background:#1e1b4b;color:#a5b4fc}
    body.dark .bottom-nav{border-top-color:#222}
    body.dark .bottom-nav a{color:#999}
    body.dark .sec-label{color:#666}
    body.dark .process-section img{background:#1a1a1a}
    body.dark .video-placeholder{background:#1a1a1a;color:#999}
    body.dark .lb{background:rgba(0,0,0,0.97)}
    a{color:var(--th);text-decoration:none;font-weight:500}
    a:hover{opacity:0.7}

    .back-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bdr);padding:0.8rem 0}
    .wrap{max-width:var(--mw);margin:0 auto;padding:0 1.5rem}
    .back-nav .wrap{display:flex;justify-content:space-between;align-items:center}
    .back-nav a{font-size:14px;color:var(--tm)}.back-nav .counter{font-size:12px;color:#bbb}

    /* ── Hero carousel ── */
    .carousel{position:relative;width:100%;background:#e5e5e5;overflow:hidden;user-select:none;touch-action:pan-y}
    .carousel-track{display:flex;transition:transform 0.55s cubic-bezier(0.22,0.61,0.36,1);will-change:transform}
    .carousel-slide{flex:0 0 100%;display:flex;align-items:center;justify-content:center}
    .carousel-slide img{width:100%;height:auto;max-height:70vh;object-fit:contain;display:block;pointer-events:none}
    .carousel-arrows{position:absolute;top:50%;transform:translateY(-50%);width:100%;display:flex;justify-content:space-between;padding:0 1rem;pointer-events:none;z-index:3}
    .carousel-arrow{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);border:1px solid rgba(0,0,0,0.08);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity 0.2s;opacity:0}
    .carousel:hover .carousel-arrow{opacity:1}
    .carousel-arrow:disabled{opacity:0.2;cursor:default}
    .carousel-arrow svg{width:18px;height:18px;color:#444}
    .carousel-dots{position:absolute;bottom:1.2rem;left:50%;transform:translateX(-50%);display:flex;gap:0.5rem;z-index:2}
    .carousel-dots .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.55);cursor:pointer;transition:all 0.2s;border:none}
    .carousel-dots .dot.active{background:#fff;box-shadow:0 0 6px rgba(0,0,0,0.15);transform:scale(1.2)}
    .carousel-hint{position:absolute;bottom:2.8rem;right:1.5rem;font-size:11px;color:rgba(255,255,255,0.65);pointer-events:none;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,0.4);font-weight:500}

    /* ── Project info ── */
    .proj-info{padding:2.5rem 0 1rem}
    .proj-info h1{font-size:2rem;font-weight:700;color:var(--th);letter-spacing:-0.02em;margin-bottom:0.3rem}
    .proj-info .sub{font-size:1.05rem;color:var(--acc);font-weight:500;margin-bottom:0.7rem}
    .tags{display:flex;flex-wrap:wrap;gap:0.35rem;margin-bottom:1.2rem}
    .tags span{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;padding:0.2rem 0.5rem;border-radius:4px;background:var(--as);color:#4338ca}
    .desc{font-size:0.98rem;line-height:1.72;color:var(--tm);margin-bottom:1rem}
    .tools{font-size:0.84rem;color:#9ca3af;padding-bottom:1.2rem;border-bottom:1px solid var(--bdr)}

    /* ── Optional project-specific case study sections ── */
    .case-sections{margin:0.5rem 0 2rem}
    .case-section{padding:1.35rem 0;border-bottom:1px solid var(--bdr)}
    .case-section:last-child{border-bottom:none}
    .case-eyebrow{font-size:0.64rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--acc);margin-bottom:0.35rem}
    .case-section h2{font-size:1.25rem;line-height:1.3;font-weight:700;color:var(--th);margin-bottom:0.5rem}
    .case-section p{font-size:0.96rem;line-height:1.72;color:var(--tm);margin-bottom:0.75rem}
    .case-image-text{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:center}
    .case-image-text.media-left .case-copy{order:2}
    .case-image-text.media-left .case-media{order:1}
    .case-media img,.case-gallery img{width:100%;height:auto;border-radius:8px;background:#e5e5e5;cursor:pointer;display:block}
    .case-caption{font-size:0.74rem;line-height:1.45;color:#9ca3af;margin-top:0.35rem}
    .case-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.75rem;margin-top:0.75rem}
    .case-video video{width:100%;border-radius:8px;background:#000;margin-top:0.7rem}
    .sec-label{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#bbb;margin-bottom:0.8rem}

    /* ── Process images ── */
    .process-section{margin:1.5rem 0}
    .process-section img{width:100%;height:auto;border-radius:6px;margin-bottom:0.6rem;background:#e5e5e5;cursor:pointer;transition:box-shadow 0.2s}
    .process-section img:hover{box-shadow:0 4px 16px rgba(0,0,0,0.1)}

    /* ── Video ── */
    .video-wrap{margin-bottom:2rem}
    .video-wrap video{width:100%;border-radius:8px;background:#000}
    .video-placeholder{padding:3rem 2rem;text-align:center;background:#fafafa;border-radius:8px;color:var(--tm);font-size:0.85rem}
    .videos-grid{display:flex;flex-direction:column;gap:1.5rem;margin-bottom:2rem}
    .videos-grid .video-item{display:flex;flex-direction:column}
    .videos-grid .video-item .v-label{font-size:0.78rem;font-weight:500;color:var(--tm);margin-bottom:0.4rem}
    .videos-grid video{width:100%;border-radius:8px;background:#000}

    /* ── Bottom nav ── */
    .bottom-nav{display:flex;justify-content:space-between;padding:2rem 0 3rem;border-top:1px solid var(--bdr);margin-top:1rem;flex-wrap:wrap;gap:0.5rem}
    .bottom-nav a{font-size:14px}

    /* ── Lightbox ── */
    .lb{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.94);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s}
    .lb.active{opacity:1;pointer-events:auto}
    .lb img{max-width:94vw;max-height:92vh;object-fit:contain;border-radius:4px}
    .lb .close{position:absolute;top:1.5rem;right:1.5rem;color:#fff;font-size:2rem;cursor:pointer;opacity:0.6}
    .lb .close:hover{opacity:1}
    .lb .ctr{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:0.78rem}

    @media(max-width:640px){
      .proj-info h1{font-size:1.5rem}.carousel-slide img{max-height:50vh}.wrap{padding:0 1.15rem}.case-image-text{grid-template-columns:1fr}.case-image-text.media-left .case-copy,.case-image-text.media-left .case-media{order:initial}.case-gallery{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

  <div class="back-nav"><div class="wrap"><a href="index.html#projects">← Back</a><span class="counter" id="counter"></span></div></div>

  <!-- Carousel -->
  <div class="carousel" id="carousel">
    <div class="carousel-track" id="track"></div>
    <div class="carousel-arrows">
      <button class="carousel-arrow" id="prevArrow" aria-label="Previous"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/></svg></button>
      <button class="carousel-arrow" id="nextArrow" aria-label="Next"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg></button>
    </div>
    <div class="carousel-dots" id="dots"></div>
    <div class="carousel-hint" id="hint"></div>
  </div>

  <div class="wrap">
    <!-- Info -->
    <div class="proj-info">
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
      <div class="tags" id="tags"></div>
      <div class="desc" id="desc"></div>
      <div class="tools" id="tools"></div>
    </div>

    <!-- Optional project-specific narrative sections -->
    <div class="case-sections" id="caseSections"></div>

    <div id="defaultMedia">
      <!-- Process images -->
      <div class="process-section" id="processSection" style="display:none">
        <div class="sec-label">Process</div>
        <div id="processImages"></div>
      </div>

      <!-- Video -->
      <div class="sec-label" style="margin-bottom:0.4rem">Video</div>
      <div class="video-wrap" id="videoWrap"></div>
    </div>

    <!-- Nav -->
    <div class="bottom-nav"><a href="index.html#projects">← Back to Portfolio</a><span><a href="#" class="prev" id="prevLink">Previous</a> · <a href="#" class="next" id="nextLink">Next</a></span></div>
  </div>

  <!-- Lightbox -->
  <div class="lb" id="lb"><span class="close" id="lbClose">&times;</span><img src="" id="lbImg"><span class="ctr" id="lbCtr"></span></div>

  <script src="portfolio.js"></script>
  <script>
    PORTFOLIO_onReady(function(config) {
      if (!config||!config.projects){document.body.innerHTML='<p style="padding:3rem;text-align:center;color:red">Could not load config</p>';return}
      var projects=config.projects;
      var params=new URLSearchParams(window.location.search);
      var id=parseInt(params.get('id'))||0;
      if(id<0||id>=projects.length)id=0;
      var p=projects[id];

      document.title=p.title+' — Jiaxuan Gong';
      if(p.theme==='dark')document.body.classList.add('dark');
      document.getElementById('counter').textContent=(id+1)+' / '+projects.length;
      document.getElementById('title').textContent=p.title;
      document.getElementById('subtitle').textContent=p.subtitle;
      document.getElementById('tags').innerHTML=(p.tags||[]).map(function(t){return'<span>'+t+'</span>'}).join('');
      document.getElementById('desc').textContent=p.description;
      document.getElementById('tools').innerHTML='<strong>Tools:</strong> '+p.tools;

      function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
      function resolveImage(src){
        if(!src)return'';
        if(/^https?:\/\//.test(src)||src.indexOf('images/')===0||src.indexOf('videos/')===0)return src;
        return 'images/'+src;
      }
      function renderBody(body){
        if(Array.isArray(body))return body.map(function(x){return'<p>'+esc(x)+'</p>'}).join('');
        return body?'<p>'+esc(body)+'</p>':'';
      }
      function renderImage(img){
        if(!img||!img.src)return'';
        var src=resolveImage(img.src);
        return '<div class="case-media"><img src="'+src+'" alt="'+esc(img.alt||p.title)+'" loading="lazy" onclick="openLbImg(this.src)">'+(img.caption?'<div class="case-caption">'+esc(img.caption)+'</div>':'')+'</div>';
      }
      function renderCaseSections(sections){
        if(!Array.isArray(sections)||!sections.length)return false;
        var html='';
        sections.forEach(function(sec){
          var type=sec.type||'text';
          var intro=(sec.eyebrow?'<div class="case-eyebrow">'+esc(sec.eyebrow)+'</div>':'')+(sec.title?'<h2>'+esc(sec.title)+'</h2>':'')+renderBody(sec.body);
          if(type==='imageText'){
            var side=sec.imagePosition==='left'?' media-left':'';
            html+='<section class="case-section case-image-text'+side+'"><div class="case-copy">'+intro+'</div>'+renderImage(sec.image||sec.media)+'</section>';
          }else if(type==='gallery'){
            var imgs=(sec.images||[]).map(renderImage).join('');
            html+='<section class="case-section">'+intro+'<div class="case-gallery">'+imgs+'</div></section>';
          }else if(type==='video'){
            var src=sec.src||sec.video;
            var poster=sec.poster||p.hero||'';
            html+='<section class="case-section case-video">'+intro+(src?'<video controls poster="'+esc(poster)+'" preload="metadata"><source src="'+esc(src)+'" type="video/mp4"></video>':'')+'</section>';
          }else{
            html+='<section class="case-section">'+intro+(sec.image?renderImage(sec.image):'')+'</section>';
          }
        });
        document.getElementById('caseSections').innerHTML=html;
        return true;
      }
      var hasCustomSections=renderCaseSections(p.sections);
      if(hasCustomSections)document.getElementById('defaultMedia').style.display='none';

      // ── Build carousel ──
      var allSlides=[];
      if(p.hero)allSlides.push(p.hero);
      if(p.images&&p.images.length)allSlides=allSlides.concat(p.images.map(function(img){return'images/'+img.src}));
      var curIdx=0,total=allSlides.length,track=document.getElementById('track'),dots=document.getElementById('dots'),hint=document.getElementById('hint');
      var prevArrow=document.getElementById('prevArrow'),nextArrow=document.getElementById('nextArrow');
      var wheelLock=false,touchStartX=0;

      function goTo(idx){
        curIdx=Math.max(0,Math.min(idx,total-1));
        track.style.transform='translateX('+(-curIdx*100)+'%)';
        document.querySelectorAll('.carousel-dots .dot').forEach(function(d,i){d.classList.toggle('active',i===curIdx)});
        hint.textContent=total>1?(curIdx+1)+'/'+total:'';
        prevArrow.disabled=curIdx===0;
        nextArrow.disabled=curIdx>=total-1;
      }

      if(!total){
        document.getElementById('carousel').style.display='none';
      }else{
        allSlides.forEach(function(src,i){
          var slide=document.createElement('div');slide.className='carousel-slide';
          var img=document.createElement('img');img.src=src;img.alt=p.title;img.loading=i===0?'eager':'lazy';
          img.addEventListener('click',function(){openLb(i)});
          slide.appendChild(img);track.appendChild(slide);
          var d=document.createElement('span');d.className='dot'+(i===0?' active':'');
          d.addEventListener('click',function(){goTo(i)});
          dots.appendChild(d);
        });

        if(total>1){
          // Smooth wheel with debounce
          var carousel=document.getElementById('carousel');
          carousel.addEventListener('wheel',function(e){
            e.preventDefault();
            if(wheelLock)return;
            if(e.deltaY>30&&curIdx<total-1){wheelLock=true;goTo(curIdx+1)}
            else if(e.deltaY<-30&&curIdx>0){wheelLock=true;goTo(curIdx-1)}
            setTimeout(function(){wheelLock=false},600);
          },{passive:false});

          // Touch swipe
          carousel.addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX},{passive:true});
          carousel.addEventListener('touchend',function(e){
            var dx=e.changedTouches[0].clientX-touchStartX;
            if(Math.abs(dx)>50){if(dx<0&&curIdx<total-1)goTo(curIdx+1);else if(dx>0&&curIdx>0)goTo(curIdx-1)}
          });

          // Arrow buttons
          prevArrow.addEventListener('click',function(){goTo(curIdx-1)});
          nextArrow.addEventListener('click',function(){goTo(curIdx+1)});
        }
        goTo(0);
      }

      // ── Process images
      if(!hasCustomSections&&p.processImages&&p.processImages.length){
        document.getElementById('processSection').style.display='';
        var phtml='';
        p.processImages.forEach(function(pi){phtml+='<img src="images/'+pi.src+'" alt="'+pi.alt+'" loading="lazy" onclick="openLbImg(this.src)">'});
        document.getElementById('processImages').innerHTML=phtml;
      }

      // ── Video
      var vw=document.getElementById('videoWrap');
      if(!hasCustomSections){
        if(p.videos&&p.videos.length){
          var vhtml='<div class=\"videos-grid\">';
          p.videos.forEach(function(v){vhtml+='<div class=\"video-item\"><div class=\"v-label\">'+v.title+'</div><video controls poster=\"'+(v.poster||p.hero)+'\" preload=\"metadata\"><source src=\"'+v.src+'\" type=\"video/mp4\"></video>'+(v.summary?'<div class=\"case-caption\">'+esc(v.summary)+'</div>':'')+'</div>'});
          vhtml+='</div>';vw.innerHTML=vhtml;
        }else if(p.video&&p.video.src){
          vw.innerHTML='<video controls poster=\"'+(p.video.poster||p.hero)+'\" preload=\"metadata\"><source src=\"'+p.video.src+'\" type=\"video/mp4\"></video>'+(p.video.summary?'<div class=\"case-caption\">'+esc(p.video.summary)+'</div>':'');
        }else{vw.innerHTML='<div class=\"video-placeholder\">Video demo available upon request — <a href=\"mailto:'+(config.site?config.site.email:'')+'\">contact me</a></div>'}
      }

      // ── Nav
      var prevId=(id-1+projects.length)%projects.length,nextId=(id+1)%projects.length;
      document.getElementById('prevLink').href='project.html?id='+prevId;
      document.getElementById('nextLink').href='project.html?id='+nextId;

      // ── Lightbox
      var lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCtr=document.getElementById('lbCtr'),lbIdx=0;
      window.openLb=function(idx){lbIdx=idx;lbImg.src=allSlides[idx];lbCtr.textContent=(idx+1)+'/'+allSlides.length;lb.classList.add('active');document.body.style.overflow='hidden'};
      window.openLbImg=function(src){lbIdx=-1;lbImg.src=src;lbCtr.textContent='';lb.classList.add('active');document.body.style.overflow='hidden'};
      function closeLb(){lb.classList.remove('active');document.body.style.overflow=''}
      document.getElementById('lbClose').addEventListener('click',closeLb);
      lb.addEventListener('click',function(e){if(e.target===lb)closeLb()});
      document.addEventListener('keydown',function(e){if(!lb.classList.contains('active'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft'&&lbIdx>=0&&lbIdx>0)openLb(lbIdx-1);if(e.key==='ArrowRight'&&lbIdx>=0&&lbIdx<allSlides.length-1)openLb(lbIdx+1)});
    });
  </script>
</body>
</html>
