<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Editor — Jiaxuan Gong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f4f4f6;--c1:#fff;--text:#1d1d1f;--t2:#6e6e73;--acc:#6366f1;--bdr:#e5e5e5;--r:8px;--red:#dc2626;--green:#16a34a;--h:100vh}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow:hidden;height:var(--h);-webkit-font-smoothing:antialiased}

    /* ── Layout ── */
    .app{display:flex;height:var(--h)}
    .sidebar{width:260px;min-width:260px;background:var(--c1);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-h{padding:1rem 1rem 0.7rem;border-bottom:1px solid var(--bdr);flex-shrink:0}
    .sidebar-h h1{font-size:0.95rem;font-weight:700;display:flex;align-items:center;gap:0.4rem}
    .sidebar-h h1 span{font-size:0.6rem;background:var(--acc);color:#fff;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:0.04em}
    .proj-list{flex:1;overflow-y:auto;padding:0.4rem 0}
    .proj-item{padding:0.55rem 1rem;cursor:pointer;display:flex;align-items:center;gap:0.5rem;border-left:3px solid transparent;transition:all 0.12s;font-size:0.8rem;position:relative}
    .proj-item:hover{background:#f5f5f7}
    .proj-item.active{background:#eef2ff;border-left-color:var(--acc)}
    .proj-item.active .ptitle{color:var(--acc);font-weight:600}
    .proj-item .dot{width:7px;height:7px;border-radius:50%;background:#ddd;flex-shrink:0}
    .proj-item.active .dot{background:var(--acc)}
    .proj-item .ptitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .proj-item .drag-hint{color:#ccc;font-size:0.75rem;cursor:grab;opacity:0;transition:opacity 0.15s}
    .proj-item:hover .drag-hint{opacity:1}
    .sidebar-foot{padding:0.7rem 1rem;border-top:1px solid var(--bdr);display:flex;gap:0.3rem;flex-shrink:0}
    .btn{display:inline-flex;align-items:center;gap:0.3rem;padding:0.4rem 0.75rem;border-radius:6px;border:1px solid var(--bdr);background:var(--c1);font-size:0.75rem;font-weight:500;cursor:pointer;transition:all 0.15s;font-family:inherit;color:var(--text);white-space:nowrap}
    .btn:hover{border-color:#bbb;background:#fafafa}
    .btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
    .btn.primary:hover{opacity:0.9;background:var(--acc)}
    .btn.icon{padding:0.35rem 0.45rem;border:none;background:transparent;font-size:0.9rem}
    .btn.icon:hover{background:#eee}

    /* ── Main area ── */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .toolbar{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 1rem;background:var(--c1);border-bottom:1px solid var(--bdr);flex-shrink:0;gap:0.5rem;flex-wrap:wrap}
    .toolbar .tabs{display:flex;gap:0.2rem}
    .toolbar .tab{padding:0.3rem 0.7rem;border-radius:5px;font-size:0.75rem;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:inherit;transition:all 0.12s}
    .toolbar .tab.active{background:#eee;color:var(--text);font-weight:500}
    .toolbar .changed{display:flex;align-items:center;gap:0.3rem;font-size:0.7rem;color:var(--acc)}
    .toolbar .changed .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
    .content{flex:1;display:flex;overflow:hidden}

    /* ── Editor panel ── */
    .editor{flex:1;overflow-y:auto;padding:1.2rem 1.5rem;min-width:0}
    .empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--t2);font-size:0.9rem;text-align:center;flex-direction:column;gap:0.5rem}
    .empty-state .icon{font-size:3rem;opacity:0.4}
    .field{margin-bottom:1rem}
    .field label{display:block;font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--t2);margin-bottom:0.2rem}
    .field label .opt{font-weight:400;text-transform:none;color:#aaa}
    .field input,.field textarea{width:100%;padding:0.45rem 0.55rem;border:1px solid var(--bdr);border-radius:5px;font-size:0.82rem;font-family:inherit;background:var(--c1)}
    .field input:focus,.field textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(99,102,241,0.08)}
    .field textarea{resize:vertical;min-height:60px}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem}
    .tags-wrap{display:flex;flex-wrap:wrap;gap:0.25rem;padding:0.3rem;border:1px solid var(--bdr);border-radius:5px;background:var(--c1);min-height:32px;align-items:center}
    .tags-wrap:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px rgba(99,102,241,0.08)}
    .tags-wrap input{border:none;outline:none;flex:1;min-width:60px;font-size:0.76rem;padding:2px 3px}
    .tagchip{display:inline-flex;align-items:center;gap:1px;padding:1px 6px;background:#eef2ff;color:#4338ca;border-radius:4px;font-size:0.68rem;font-weight:500}
    .tagchip .x{cursor:pointer;opacity:0.4;margin-left:2px}.tagchip .x:hover{opacity:1}

    /* ── Gallery ── */
    .gitems{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.3rem;min-height:40px}
    .gitem{position:relative;width:90px;height:68px;border-radius:5px;overflow:hidden;border:2px solid transparent;cursor:grab;flex-shrink:0;background:#e5e5e5;transition:transform 0.15s,box-shadow 0.15s}
    .gitem:active{cursor:grabbing;transform:scale(1.05);box-shadow:0 4px 16px rgba(0,0,0,0.15);z-index:10}
    .gitem.drag-over{border-color:var(--acc);border-style:dashed}
    .gitem img{width:100%;height:100%;object-fit:cover;pointer-events:none}
    .gitem .gi-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.15s}
    .gitem:hover .gi-del{opacity:1}
    .gitem .gi-hero{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.55);color:#fff;font-size:0.5rem;padding:1px 4px;border-radius:3px;opacity:0;transition:opacity 0.15s}
    .gitem:hover .gi-hero{opacity:1}
    .gitem.is-hero{border-color:var(--acc)}
    .gitem.is-hero .gi-hero{opacity:1;background:var(--acc)}
    .upload-slot{width:90px;height:68px;border:2px dashed #ccc;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#aaa;transition:all 0.15s;font-size:1.5rem}
    .upload-slot:hover{border-color:var(--acc);color:var(--acc);background:#f0f0ff}

    /* ── Preview panel ── */
    .preview{width:380px;min-width:280px;border-left:1px solid var(--bdr);background:#fff;display:flex;flex-direction:column;overflow:hidden}
    .preview-h{padding:0.5rem 0.8rem;border-bottom:1px solid var(--bdr);font-size:0.7rem;color:var(--t2);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .preview iframe{flex:1;border:none;width:100%}

    /* ── Modal ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .modal{background:#fff;border-radius:12px;max-width:680px;width:94%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
    .modal-h{padding:0.8rem 1rem;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;border-radius:12px 12px 0 0}
    .modal-h h2{font-size:0.9rem;font-weight:600}
    .modal-b{padding:1rem}
    .dropzone{border:2px dashed #ccc;border-radius:10px;padding:2rem 1rem;text-align:center;cursor:pointer;background:#fafafa;transition:all 0.2s}
    .dropzone:hover,.dropzone.dragover{border-color:var(--acc);background:#f0f0ff}
    .dropzone p{font-size:0.8rem;color:var(--t2)}
    .dropzone .icon{font-size:1.8rem;margin-bottom:0.2rem}
    .dropzone input{display:none}
    .up-grid{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.6rem}
    .up-item{position:relative;width:90px;height:68px;border-radius:5px;overflow:hidden;border:2px solid var(--green);background:#eee}
    .up-item img{width:100%;height:100%;object-fit:cover}
    .up-item .fn{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);color:#fff;font-size:0.5rem;padding:2px 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .up-item .remove-btn{position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}

    /* ── Toast ── */
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:0.6rem 1.2rem;border-radius:20px;font-size:0.8rem;z-index:9999;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:normal;max-width:min(92vw,720px);text-align:center}
    .toast.show{opacity:1}

    /* ── Delete confirm ── */
    .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
    .confirm-overlay.active{opacity:1;pointer-events:auto}
    .confirm-box{background:#fff;border-radius:12px;padding:1.5rem 2rem;text-align:center;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
    .confirm-box p{font-size:0.9rem;margin-bottom:1rem;color:var(--t2)}
    .confirm-box h3{font-size:1.1rem;margin-bottom:0.3rem}
    .confirm-box .btns{display:flex;gap:0.5rem;justify-content:center}

    @media(max-width:900px){.preview{display:none}.sidebar{width:220px;min-width:220px}}
    @media(max-width:700px){.app{flex-direction:column}.sidebar{width:100%;min-width:0;flex-shrink:0;max-height:40vh}.sidebar-h h1{font-size:0.85rem}.main{min-height:0}.preview{display:none}.editor{padding:0.8rem}}
  </style>
</head>
<body>

  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-h"><h1>Projects <span>CMS</span></h1><button class="btn small" style="margin-top:0.4rem;width:100%" onclick="openSiteSettings()">⚙ Site Settings</button></div>
      <div class="proj-list" id="projList"></div>
      <div class="sidebar-foot">
        <button class="btn" style="flex:1" onclick="addNew()">+ Add Project</button>
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="toolbar">
        <div class="tabs">
          <button class="tab active" id="tabEdit" onclick="switchTab('edit')">✎ Edit</button>
          <button class="tab" id="tabPreview" onclick="switchTab('preview')">👁 Preview</button>
        </div>
        <div style="display:flex;gap:0.4rem;align-items:center">
          <span class="changed" id="changedIndicator" style="display:none"><span class="dot"></span> Unsaved</span>
          <button class="btn" onclick="loadDraftFromStorage()" title="Load the local browser draft">Load Draft</button>
          <button class="btn" onclick="saveDraft()" title="Save a local browser draft. This does not deploy.">Save Draft</button>
          <button class="btn" onclick="clearDraftAndReload()" title="Clear only this portfolio draft and reload from server">Clear Draft</button>
          <button class="btn primary" onclick="doDeploy()" id="deployBtn">🚀 Deploy</button>
        </div>
      </div>
      <div class="content">
        <div class="editor" id="editorPanel">
          <div class="empty-state" id="emptyState">
            <div class="icon">📂</div>
            <p>Select a project from the left to edit</p>
            <p style="font-size:0.7rem">Ctrl+S to save and download</p>
          </div>
          <div id="editorForm" style="display:none"></div>
        </div>
        <div class="preview" id="previewPanel" style="display:none">
          <div class="preview-h">
            <span>Live Preview — project.html?id=<span id="previewIdx">0</span></span>
            <button class="btn icon" onclick="updatePreview()" title="Refresh preview">↻</button>
          </div>
          <iframe id="previewFrame" src="" frameborder="0"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Site Settings Modal -->
  <div class="modal-overlay" id="siteSettingsModal">
    <div class="modal">
      <div class="modal-h"><h2>Site Settings</h2><button class="btn icon" onclick="closeSiteSettings()">✕</button></div>
      <div class="modal-b">
        <div class="field"><label>Your Name</label><input id="ssName" placeholder="Jiaxuan Gong"></div>
        <div class="field"><label>Tagline <span class="opt">(one short sentence)</span></label><input id="ssTagline" placeholder="I build prototypes, run user studies, and write."></div>
        <div class="field-row">
          <div class="field"><label>Email</label><input id="ssEmail" placeholder="you@email.com"></div>
          <div class="field"><label>Google Scholar URL</label><input id="ssScholar" placeholder="https://scholar.google.com/citations?user=..."></div>
        </div>
        <div class="field-row"><div class="field"><label>GitHub URL or Username</label><input id="ssGitHub" placeholder="gongjiaxuan or https://github.com/gongjiaxuan"></div></div>
        <div class="field"><label>Profile Photo</label>
          <div style="display:flex;align-items:center;gap:1rem;margin-top:0.3rem">
            <div id="photoPreview" style="width:80px;height:80px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--acc);overflow:hidden;flex-shrink:0;border:2px solid #ddd"><span id="photoInit">JG</span><img id="photoImg" src="" style="display:none;width:100%;height:100%;object-fit:cover"></div>
            <div>
              <button class="btn" onclick="document.getElementById('photoInput').click()">📷 Choose Photo</button>
              <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoPick(this.files)" style="display:none">
              <button class="btn small danger" onclick="removePhoto()" style="margin-top:0.3rem">✕ Remove</button>
              <div style="font-size:0.65rem;color:var(--t2);margin-top:0.2rem">PNG or JPG. Square works best.</div>
            </div>
          </div>
        </div>
        <div style="margin-top:1rem;text-align:right">
          <button class="btn" onclick="closeSiteSettings()">Cancel</button>
          <button class="btn primary" style="margin-left:0.4rem" onclick="saveSiteSettings()">✓ Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal">
      <div class="modal-h"><h2 id="modalTitle">Upload Images</h2><button class="btn icon" onclick="closeUpload()">✕</button></div>
      <div class="modal-b">
        <div class="dropzone" id="dropzone" ondragover="this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="event.preventDefault();this.classList.remove('dragover');handleFiles(event.dataTransfer.files)" onclick="document.getElementById('fileInput').click()">
          <div class="icon">📁</div>
          <p>Click to browse or drag & drop</p>
          <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">
        </div>
        <div class="up-grid" id="uploadPreviews"></div>
        <div style="margin-top:0.8rem;text-align:right;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:0.7rem;color:var(--t2)" id="uploadCount"></span>
          <span><button class="btn" onclick="closeUpload()">Cancel</button><button class="btn primary" style="margin-left:0.4rem" onclick="confirmUpload()">✓ Add</button></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Video Modal -->
  <div class="modal-overlay" id="videoModal">
    <div class="modal">
      <div class="modal-h"><h2>Upload Video</h2><button class="btn icon" onclick="closeVideoUpload()">✕</button></div>
      <div class="modal-b">
        <div class="dropzone" id="vDropzone" ondragover="this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="event.preventDefault();this.classList.remove('dragover');handleVideo(event.dataTransfer.files)" onclick="document.getElementById('videoInput').click()">
          <div class="icon">🎬</div>
          <p>Click to select video (MP4, max 100MB)</p>
          <input type="file" id="videoInput" accept="video/mp4,video/quicktime,video/webm" onchange="handleVideo(this.files)">
        </div>
        <div id="videoPreview" style="margin-top:0.6rem"></div>
        <div style="margin-top:0.8rem;text-align:right"><button class="btn" onclick="closeVideoUpload()">Cancel</button><button class="btn primary" style="margin-left:0.4rem" onclick="confirmVideoUpload()">✓ Use</button></div>
      </div>
    </div>
  </div>

  <!-- Confirm -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box"><h3 id="confirmTitle">Delete?</h3><p id="confirmMsg"></p><div class="btns"><button class="btn" id="confirmCancel">Cancel</button><button class="btn primary" id="confirmOk" style="background:var(--red);border-color:var(--red)">Delete</button></div></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    var cfg = null;
    var curIdx = -1;
    var pendingFiles = [];
    var pendingVideo = null;
    var changed = false;

    // ── Init ──
    fetch('config.json?t=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(c) {
        cfg = c;
        var hasDraft = draftAvailable();
        renderSidebar();
        if (cfg.projects && cfg.projects.length > 0) { selectProject(0); }
        if (hasDraft) { toast('Local draft available. Use Load Draft if needed.'); }
      })
      .catch(function() { document.body.innerHTML = '<p style="padding:3rem;text-align:center;color:red">Could not load config.json<br><small>Open this page from: <code>gongjiaxuan.github.io/admin.html</code></small><br><br><button class="btn" onclick="clearDraftAndReload()">Clear Draft & Reload</button></p>'; });

    function toast(m, ms) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, ms || Math.min(7000, Math.max(2200, String(m).length * 55))); }
    function markChanged() { changed = true; document.getElementById('changedIndicator').style.display = 'flex'; }

    // ── Sidebar ──
    function renderSidebar() {
      var h = '';
      cfg.projects.forEach(function(p, i) {
        var thumb = p.cardImage || p.hero || '';
        var active = i === curIdx ? ' active' : '';
        h += '<div class="proj-item' + active + '" data-idx="' + i + '" onclick="selectProject(' + i + ')" draggable="true" ondragstart="dragStart(event,' + i + ')" ondragover="dragOver(event)" ondrop="drop(event,' + i + ')">';
        h += '<span class="dot"></span><span class="ptitle">' + esc(p.title) + '</span>';
        h += '<span class="drag-hint">⋮⋮</span>';
        h += '</div>';
      });
      document.getElementById('projList').innerHTML = h;
    }

    function selectProject(i) {
      curIdx = i;
      renderSidebar();
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('editorForm').style.display = 'block';
      document.getElementById('editorPanel').style.display = '';
      document.getElementById('previewPanel').style.display = 'none';
      document.getElementById('tabEdit').classList.add('active');
      document.getElementById('tabPreview').classList.remove('active');
      renderEditor();
      document.getElementById('previewIdx').textContent = i;
      document.getElementById('previewFrame').src = 'about:blank';
    }

    function switchTab(t) {
      document.getElementById('tabEdit').classList.toggle('active', t === 'edit');
      document.getElementById('tabPreview').classList.toggle('active', t === 'preview');
      document.getElementById('editorPanel').style.display = t === 'edit' ? '' : 'none';
      document.getElementById('previewPanel').style.display = t === 'preview' ? '' : 'none';
      if (t === 'preview') updatePreview();
    }

    function updatePreview() {
      var iframe = document.getElementById('previewFrame');
      document.getElementById('previewIdx').textContent = curIdx;
      if (iframe) iframe.src = 'project.html?id=' + curIdx + '&t=' + Date.now();
    }

    // ── Editor ──
    function renderEditor() {
      var p = cfg.projects[curIdx];
      var heroSrc = p.hero || '';
      var h = '';

      // Title + Subtitle
      h += '<div class="field-row">';
      h += '<div class="field"><label>Title</label><input value="' + escAttr(p.title) + '" onchange="setVal(\'title\',this.value)"></div>';
      h += '<div class="field"><label>Subtitle</label><input value="' + escAttr(p.subtitle) + '" onchange="setVal(\'subtitle\',this.value)"></div>';
      h += '</div>';

      // Tags
      h += '<div class="field"><label>Tags <span class="opt">(Enter to add)</span></label><div class="tags-wrap" onclick="this.querySelector(\'input\').focus()">';
      p.tags.forEach(function(t) { h += '<span class="tagchip">' + esc(t) + '<span class="x" onclick="event.stopPropagation();rmTag(\'' + escAttr(t) + '\')">×</span></span>'; });
      h += '<input placeholder="Add tag..." onkeydown="addTag(event)"></div></div>';

      // Description + Tools
      h += '<div class="field"><label>Description</label><textarea onchange="setVal(\'description\',this.value)">' + esc(p.description) + '</textarea></div>';
      h += '<div class="field"><label>Tools <span class="opt">(e.g. Figma · User Interviews · Prototyping)</span></label><input value="' + escAttr(p.tools) + '" onchange="setVal(\'tools\',this.value)"></div>';

      // Hero
      h += '<div class="field"><label>Hero Image</label>';
      h += '<div style="display:flex;align-items:flex-start;gap:0.6rem">';
      if (heroSrc) h += '<img src="' + escAttr(heroSrc) + '" style="width:120px;height:auto;max-height:90px;object-fit:cover;border-radius:5px;background:#eee" onerror="this.style.display=\'none\'">';
      h += '<div style="flex:1"><input value="' + escAttr(heroSrc) + '" onchange="setVal(\'hero\',this.value)" placeholder="images/remembery/board.jpg"><div style="font-size:0.6rem;color:var(--t2);margin-top:0.2rem">Click any image in gallery below to auto-set as hero.</div></div>';
      h += '</div></div>';

      // Card thumbnail
      h += '<div class="field"><label>Card Thumbnail <span class="opt">(homepage card image)</span></label><input value="' + escAttr(p.cardImage || '') + '" onchange="setVal(\'cardImage\',this.value)" placeholder="images/remembery.jpg">';

      // Layout
      var layouts = ['stacked', 'grid', 'masonry'];
      h += '<div class="field-row"><div class="field"><label>Gallery Layout</label><select onchange="setVal(\'layout\',this.value)" style="width:100%;padding:0.4rem 0.5rem;border:1px solid var(--bdr);border-radius:5px;font-size:0.82rem;font-family:inherit;background:var(--c1)">';
      layouts.forEach(function(l) { h += '<option value="' + l + '"' + ((p.layout||'stacked')===l?' selected':'') + '>' + l.charAt(0).toUpperCase()+l.slice(1) + '</option>'; });
      h += '</select><div style="font-size:0.6rem;color:var(--t2);margin-top:0.15rem">Stacked: full-width · Grid: 2-column · Masonry: staggered</div></div>';
      h += '<div class="field"><label>Hero Height <span class="opt">(for project page)</span></label><select onchange="setVal(\'heroHeight\',this.value)" style="width:100%;padding:0.4rem 0.5rem;border:1px solid var(--bdr);border-radius:5px;font-size:0.82rem;font-family:inherit;background:var(--c1)">';
      ['auto','medium','large'].forEach(function(hh) { h += '<option value="' + hh + '"' + ((p.heroHeight||'auto')===hh?' selected':'') + '>' + hh.charAt(0).toUpperCase()+hh.slice(1) + '</option>'; });
      h += '</select></div></div>';

      // Gallery
      h += '<div class="field"><label>Gallery Images <span class="opt">(drag to reorder · click × to remove · click image to set hero · click caption text to edit)</span></label>';
      h += '<div class="gitems" id="galleryArea">';
      p.images.forEach(function(img, j) {
        var src = 'images/' + img.src;
        var isHero = (p.hero === src) ? ' is-hero' : '';
        h += '<div style="display:flex;flex-direction:column;gap:0.15rem;align-items:center;margin-bottom:0.4rem">';
        h += '<div class="gitem' + isHero + '" draggable="true" data-gidx="' + j + '" ondragstart="gDragStart(event,' + j + ')" ondragover="gDragOver(event)" ondrop="gDrop(event,' + j + ')" onclick="setHero(' + j + ')">';
        h += '<img src="' + src + '" onerror="this.style.background=\'#ddd\'">';
        h += '<button class="gi-del" onclick="event.stopPropagation();rmImg(' + j + ')">×</button>';
        h += '<span class="gi-hero">Hero</span>';
        h += '</div>';
        h += '<input value="' + escAttr(img.caption || '') + '" onchange="setCaption(' + j + ',this.value)" placeholder="+ caption" style="width:90px;font-size:0.6rem;padding:2px 4px;border:1px solid transparent;border-radius:3px;text-align:center;background:transparent" onfocus="this.style.borderColor=\'var(--acc)\';this.style.background=\'#fff\'" onblur="this.style.borderColor=\'transparent\';this.style.background=\'transparent\'">';
        h += '</div>';
      });
      h += '<div class="upload-slot" onclick="openUpload()">+</div>';
      h += '</div></div>';

      // Video
      var vname = p.video ? p.video.src : '';
      h += '<div class="field"><label>Video</label>';
      h += '<div style="display:flex;gap:0.4rem"><input value="' + escAttr(vname) + '" onchange="setVideo(this.value)" placeholder="videos/demo.mp4" style="flex:1">';
      h += '<button class="btn" onclick="openVideoUpload()">🎬 Upload</button>';
      if (vname) h += '<button class="btn" onclick="setVideo(\'\');renderEditor()" style="color:var(--red);border-color:#fca5a5">✕</button>';
      h += '</div></div>';

      // Process images
      h += '<div class="field"><label>Process Images <span class="opt">(research diagrams, wireframes, user journey maps — appears between text and video)</span></label>';
      h += '<div class="gitems">';
      (p.processImages||[]).forEach(function(pi, j) {
        var src = 'images/' + pi.src;
        h += '<div class="gitem">';
        h += '<img src="' + src + '" onerror="this.style.background=\'#ddd\'">';
        h += '<button class="gi-del" onclick="event.stopPropagation();rmProcImg(' + j + ')">×</button>';
        h += '</div>';
      });
      h += '<button class="upload-slot" onclick="event.stopPropagation();openProcUpload()">+</button>';
      h += '</div></div>';

      // Custom narrative sections
      h += '<div class="field"><label>Custom Detail Sections JSON <span class="opt">(optional advanced case-study layout; leave empty to use Gallery + Process + Video)</span></label>';
      h += '<textarea onchange="setSectionsJson(this.value)" placeholder=\'[{ "type": "text", "title": "Research Context", "body": "..." }]\' style="min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.72rem">' + esc(JSON.stringify(p.sections || [], null, 2)) + '</textarea>';
      h += '<div style="font-size:0.6rem;color:var(--t2);margin-top:0.2rem">Supported types: text, imageText, gallery, video. When sections exist, project.html uses them instead of the default process/video stack.</div></div>';

      // Delete + Preview
      h += '<div style="display:flex;gap:0.4rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--bdr)">';
      h += '<button class="btn" onclick="window.open(\'project.html?id=' + curIdx + '\',\'_blank\')">↗ Open Live</button>';
      h += '<button class="btn" style="color:var(--red);border-color:#fca5a5;margin-left:auto" onclick="confirmDelete()">🗑 Delete Project</button>';
      h += '</div>';

      document.getElementById('editorForm').innerHTML = h;
      document.getElementById('editorPanel').scrollTop = 0;
    }

    function updatePreview() {
      // Simple refresh hint for iframe mode
      var iframe = document.getElementById('previewFrame');
      if (iframe) { iframe.src = 'project.html?id=' + curIdx + '&t=' + Date.now(); }
    }

    // ── Data setters ──
    function setVal(key, val) { cfg.projects[curIdx][key] = val; markChanged(); }
    function setVideo(val) {
      if (!val) { cfg.projects[curIdx].video = null; } else {
        if (!cfg.projects[curIdx].video) cfg.projects[curIdx].video = {};
        cfg.projects[curIdx].video.src = val;
      }
      markChanged();
    }
    function setHero(j) {
      var p = cfg.projects[curIdx];
      p.hero = 'images/' + p.images[j].src;
      p.cardImage = p.hero;
      markChanged(); renderEditor(); toast('Hero + card image synced ✓');
    }
    function addTag(ev) { if (ev.key !== 'Enter') return; ev.preventDefault(); var v = ev.target.value.trim(); if (v && cfg.projects[curIdx].tags.indexOf(v) === -1) { cfg.projects[curIdx].tags.push(v); markChanged(); renderEditor(); } }
    function rmTag(t) { cfg.projects[curIdx].tags = cfg.projects[curIdx].tags.filter(function(x) { return x !== t; }); markChanged(); renderEditor(); }
    function rmImg(j) { cfg.projects[curIdx].images.splice(j, 1); markChanged(); renderEditor(); }
    function setCaption(j, val) { cfg.projects[curIdx].images[j].caption = val; markChanged(); }
    function setSectionsJson(val) {
      var p = cfg.projects[curIdx];
      if (!val.trim()) { delete p.sections; markChanged(); toast('Custom sections cleared'); return; }
      try {
        var parsed = JSON.parse(val);
        if (!Array.isArray(parsed)) throw new Error('Sections must be an array');
        p.sections = parsed;
        markChanged();
        toast('Custom sections updated');
      } catch(e) {
        toast('Invalid sections JSON: ' + e.message);
      }
    }

    // Process images
    function openProcUpload() { openUpload('process'); }
    function rmProcImg(j) { cfg.projects[curIdx].processImages.splice(j, 1); markChanged(); renderEditor(); }

    // ── Gallery drag reorder ──
    var gDragIdx = null;
    function gDragStart(ev, j) { gDragIdx = j; ev.dataTransfer.effectAllowed = 'move'; }
    function gDragOver(ev) { ev.preventDefault(); }
    function gDrop(ev, to) {
      ev.preventDefault(); if (gDragIdx === null || gDragIdx === to) return;
      var imgs = cfg.projects[curIdx].images;
      var item = imgs.splice(gDragIdx, 1)[0]; imgs.splice(to, 0, item);
      gDragIdx = null; markChanged(); renderEditor();
    }

    // ── Project drag reorder ──
    var pDragIdx = null;
    function dragStart(ev, i) { pDragIdx = i; ev.dataTransfer.effectAllowed = 'move'; }
    function dragOver(ev) { ev.preventDefault(); }
    function drop(ev, to) { ev.preventDefault(); if (pDragIdx === null || pDragIdx === to) return; var item = cfg.projects.splice(pDragIdx, 1)[0]; cfg.projects.splice(to, 0, item); curIdx = cfg.projects.indexOf(item); pDragIdx = null; markChanged(); renderSidebar(); renderEditor(); }

    // ── Upload ──
    var uploadTarget = { type: 'gallery' };
    function openUpload(type) {
      uploadTarget.type = type || 'gallery';
      pendingFiles = []; document.getElementById('uploadPreviews').innerHTML = '';
      document.getElementById('uploadCount').textContent = ''; document.getElementById('fileInput').value = '';
      document.getElementById('uploadModal').classList.add('active');
      document.getElementById('modalTitle').textContent = type === 'process' ? 'Upload Process Images' : (type === 'hero' ? 'Upload Hero Image' : 'Upload Gallery Images');
    }
    function closeUpload() { document.getElementById('uploadModal').classList.remove('active'); pendingFiles.forEach(function(f) { URL.revokeObjectURL(f.objectURL); }); pendingFiles = []; }
    function handleFiles(files) {
      pendingFiles = []; document.getElementById('uploadPreviews').innerHTML = '';
      for (var i = 0; i < files.length; i++) {
        var f = files[i]; if (!f.type.match(/image\//)) continue;
        var url = URL.createObjectURL(f);
        pendingFiles.push({ file: f, objectURL: url });
        var d = document.createElement('div'); d.className = 'up-item';
        d.innerHTML = '<img src="' + url + '"><div class="fn">' + f.name + '</div>';
        document.getElementById('uploadPreviews').appendChild(d);
      }
      document.getElementById('uploadCount').textContent = pendingFiles.length + ' file(s) selected';
    }
    function confirmUpload() {
      if (!pendingFiles.length) { closeUpload(); return; }
      var p = cfg.projects[curIdx];
      if (!p._uploads) p._uploads = [];
      var type = uploadTarget.type || 'gallery';
      var added = 0;
      pendingFiles.forEach(function(item) {
        var fn = Date.now().toString(36) + '_' + item.file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        if (type === 'process') {
          if (!p.processImages) p.processImages = [];
          p.processImages.push({ src: p.id + '/' + fn, alt: item.file.name });
        } else {
          p.images.push({ src: p.id + '/' + fn, alt: item.file.name });
        }
        p._uploads.push({ file: item.file, path: 'images/' + p.id + '/' + fn });
        added++;
      });
      markChanged(); renderEditor(); closeUpload();
      toast('Added ' + added + ' image(s) to ' + type);
    }

    function openVideoUpload() { pendingVideo = null; document.getElementById('videoInput').value = ''; document.getElementById('videoPreview').innerHTML = ''; document.getElementById('videoModal').classList.add('active'); }
    function closeVideoUpload() { document.getElementById('videoModal').classList.remove('active'); pendingVideo = null; }
    function handleVideo(files) { if (!files || !files[0]) return; var f = files[0]; if (f.size > 100 * 1024 * 1024) { toast('File >100MB'); return; } pendingVideo = f; document.getElementById('videoPreview').innerHTML = '<p style="font-size:0.75rem;color:var(--acc)">✓ ' + f.name + ' (' + (f.size/1024/1024).toFixed(1) + ' MB)</p>'; }
    function confirmVideoUpload() {
      if (!pendingVideo) return;
      var p = cfg.projects[curIdx];
      var rawName = Date.now().toString(36) + '_' + pendingVideo.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      var fn = rawName.replace(/\.[^.]+$/, '') + '.mp4';
      var vpath = 'videos/' + fn;
      p.video = { src: vpath, poster: p.hero || '' };
      if (!p._uploads) p._uploads = [];
      p._uploads.push({ file: pendingVideo, path: vpath });
      markChanged(); renderEditor(); closeVideoUpload();
      toast('Video added: ' + fn);
    }

    // ── Delete ──
    function confirmDelete() {
      var p = cfg.projects[curIdx];
      var overlay = document.getElementById('confirmOverlay');
      document.getElementById('confirmTitle').textContent = 'Delete "' + p.title + '"?';
      document.getElementById('confirmMsg').textContent = 'This cannot be undone.';
      overlay.classList.add('active');
      document.getElementById('confirmOk').onclick = function() {
        cfg.projects.splice(curIdx, 1); curIdx = Math.min(curIdx, cfg.projects.length - 1);
        overlay.classList.remove('active'); markChanged(); renderSidebar();
        if (cfg.projects.length === 0) { document.getElementById('editorForm').style.display = 'none'; document.getElementById('emptyState').style.display = 'flex'; }
        else { selectProject(curIdx); }
        toast('Project deleted');
      };
      document.getElementById('confirmCancel').onclick = function() { overlay.classList.remove('active'); };
    }
    document.getElementById('confirmCancel').onclick = function() { document.getElementById('confirmOverlay').classList.remove('active'); };

    // ── Site Settings ──
    var sitePhotoFile = null;

    function openSiteSettings() {
      if (!cfg.site) cfg.site = {};
      var s = cfg.site;
      document.getElementById('ssName').value = s.name || '';
      document.getElementById('ssTagline').value = s.tagline || '';
      document.getElementById('ssEmail').value = s.email || '';
      document.getElementById('ssScholar').value = s.scholar || '';
      document.getElementById('ssGitHub').value = s.github || '';
      // Photo preview
      sitePhotoFile = null;
      var photoPath = s.photo || '';
      var img = document.getElementById('photoImg');
      var init = document.getElementById('photoInit');
      if (photoPath) {
        img.src = photoPath; img.style.display = ''; init.style.display = 'none';
      } else {
        img.style.display = 'none'; init.style.display = '';
      }
      document.getElementById('siteSettingsModal').classList.add('active');
    }
    function closeSiteSettings() { document.getElementById('siteSettingsModal').classList.remove('active'); }
    function handlePhotoPick(files) {
      if (!files || !files[0]) return;
      var f = files[0];
      sitePhotoFile = f;
      var url = URL.createObjectURL(f);
      document.getElementById('photoImg').src = url;
      document.getElementById('photoImg').style.display = '';
      document.getElementById('photoInit').style.display = 'none';
    }
    function removePhoto() {
      sitePhotoFile = null;
      if (cfg.site) { cfg.site.photo = ''; cfg.site._photoUpload = null; }
      document.getElementById('photoImg').style.display = 'none';
      document.getElementById('photoInit').style.display = '';
      markChanged();
      toast('Photo removed');
    }
    function saveSiteSettings() {
      if (!cfg.site) cfg.site = {};
      var s = cfg.site;
      s.name = document.getElementById('ssName').value.trim() || 'Jiaxuan Gong';
      s.tagline = document.getElementById('ssTagline').value.trim();
      s.email = document.getElementById('ssEmail').value.trim();
      s.scholar = document.getElementById('ssScholar').value.trim();
      s.github = document.getElementById('ssGitHub').value.trim();
      if (sitePhotoFile) {
        var fn = 'photo.' + (sitePhotoFile.name.split('.').pop() || 'jpg');
        s.photo = 'images/' + fn;
        s._photoUpload = { file: sitePhotoFile, path: 'images/' + fn };
        sitePhotoFile = null;
      }
      markChanged();
      closeSiteSettings();
      toast('Site settings saved ✓');
    }

    // ── Save Draft to localStorage ──
    function saveDraft() {
      if (hasPendingUploads()) {
        toast('Please Deploy before saving a draft. Browser drafts cannot preserve selected image/video files.', 6500);
        return false;
      }
      var clean = JSON.parse(JSON.stringify(cfg));
      delete clean._uploads; delete clean._siteUploads;
      if (clean.site) delete clean.site._photoUpload;
      clean.projects.forEach(function(p) { delete p._uploads; });
      clean._draftSavedAt = new Date().toISOString();
      try { localStorage.setItem('portfolio_draft', JSON.stringify(clean)); toast('Local draft saved. Deploy still needed.'); return true; }
      catch(e) { toast('Save failed: ' + e.message, 6500); return false; }
    }
    function hasPendingUploads() {
      if (!cfg) return false;
      if (cfg.site && cfg.site._photoUpload) return true;
      return (cfg.projects || []).some(function(p) { return p._uploads && p._uploads.length; });
    }
    function draftAvailable() {
      try { return !!localStorage.getItem('portfolio_draft'); } catch(e) { return false; }
    }
    function loadDraft() {
      try { var d = localStorage.getItem('portfolio_draft'); if (d) { cfg = JSON.parse(d); delete cfg._draftSavedAt; return true; } } catch(e) {}
      return false;
    }
    function loadDraftFromStorage() {
      if (hasPendingUploads()) { toast('Deploy uploaded files before loading a draft, otherwise selected files will be lost.', 6500); return; }
      if (!loadDraft()) { toast('No local draft found'); return; }
      curIdx = -1;
      renderSidebar();
      if (cfg.projects && cfg.projects.length > 0) { selectProject(0); }
      markChanged();
      toast('Loaded local draft. Review before deploy.');
    }
    function clearDraft() {
      try { localStorage.removeItem('portfolio_draft'); } catch(e) {}
    }
    function clearDraftAndReload() {
      clearDraft();
      location.reload();
    }

    // ── Deploy — send config + files to local server ──
    function doDeploy() {
      var btn = document.getElementById('deployBtn');
      btn.textContent = '...'; btn.disabled = true;

      // Collect all uploaded files as base64
      var files = {};
      function addFile(path, file) {
        var reader = new FileReader();
        return new Promise(function(resolve, reject) {
          reader.onload = function() { files[path] = reader.result.split(',')[1]; resolve(); };
          reader.onerror = function() { reject(new Error('Could not read file: ' + file.name)); };
          reader.readAsDataURL(file);
        });
      }

      var promises = [];
      if (cfg.site && cfg.site._photoUpload) {
        promises.push(addFile(cfg.site._photoUpload.path, cfg.site._photoUpload.file));
      }
      cfg.projects.forEach(function(p) {
        if (p._uploads) { p._uploads.forEach(function(u) { promises.push(addFile(u.path, u.file)); }); }
      });

      var clean = JSON.parse(JSON.stringify(cfg));
      delete clean._schema; delete clean._help; delete clean._uploads; delete clean._siteUploads;
      if (clean.site) delete clean.site._photoUpload;
      clean.projects.forEach(function(p) { delete p._uploads; });

      function checkDeployServerVersion() {
        return fetch('http://localhost:8765/version?t=' + Date.now())
          .then(function(r) {
            if (!r.ok) throw new Error('Deploy server is outdated. Stop it and restart deploy.py.');
            return r.text();
          })
          .then(function(text) {
            if (text.indexOf('file-safe-v2') === -1) throw new Error('Deploy server is outdated. Stop it and restart deploy.py.');
          });
      }

      Promise.all(promises).then(function() {
        var body = JSON.stringify({ config: clean, files: files, message: 'Update from CMS' });
        checkDeployServerVersion().then(function() {
          return fetch('http://localhost:8765/deploy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body });
        })
          .then(function(r) {
            return r.text().then(function(text) {
              if (!r.ok) { throw new Error(text || ('Deploy failed with HTTP ' + r.status)); }
              return text;
            });
          })
          .then(function(msg) { toast(msg); changed = false; document.getElementById('changedIndicator').style.display = 'none'; cfg._uploads = []; cfg._siteUploads = null; if(cfg.site)cfg.site._photoUpload=null; cfg.projects.forEach(function(p){p._uploads=[]}); clearDraft(); setTimeout(function(){location.reload()},1500); })
          .catch(function(err) { toast(err && err.message ? err.message : 'Cannot reach deploy server. Run: python deploy.py', 8000); })
          .finally(function() { btn.textContent = '🚀 Deploy'; btn.disabled = false; });
      }).catch(function(e) { toast('Error: ' + e.message); btn.textContent = '🚀 Deploy'; btn.disabled = false; });
    }

    // ── Save draft on unload ──
    window.addEventListener('beforeunload', function(e) {
      if (!changed) return;
      if (hasPendingUploads()) {
        e.preventDefault();
        e.returnValue = '';
        return '';
      }
      saveDraft();
    });

    // ── CRUD ──
    function addNew() {
      var id = 'project-' + Date.now();
      cfg.projects.push({ id: id, title: 'New Project', subtitle: '', tags: [], description: '', tools: '', hero: '', images: [], video: null, layout: 'stacked', cardImage: '' });
      markChanged(); renderSidebar(); selectProject(cfg.projects.length - 1);
      toast('New project added');
    }
    function resetAll() { if (confirm('Discard all changes and reload?')) location.reload(); }

    // ── Download ZIP ──
    function downloadAll() {
      var clean = JSON.parse(JSON.stringify(cfg));
      delete clean._schema; delete clean._help;
      if (clean.site) { delete clean.site._photoUpload; }
      clean.projects.forEach(function(p) { delete p._uploads; });
      var zip = new JSZip();
      var allFiles = [];
      if (cfg.site && cfg.site._photoUpload) allFiles.push(cfg.site._photoUpload);
      cfg.projects.forEach(function(p) { if (p._uploads && p._uploads.length) p._uploads.forEach(function(u) { allFiles.push(u); }); });
      zip.file('config.json', JSON.stringify(clean, null, 2));
      allFiles.forEach(function(u) { zip.file(u.path, u.file, { binary: true }); });
      var msg = allFiles.length ? 'Generating ZIP with ' + allFiles.length + ' file(s)...' : 'Downloading config.json...';
      toast(msg);
      zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } }).then(function(blob) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'portfolio-update.zip'; a.click();
        toast(allFiles.length ? '✓ Downloaded! Extract and deploy.' : '✓ config.json downloaded');
        changed = false; document.getElementById('changedIndicator').style.display = 'none';
      }).catch(function(err) { toast('Error: ' + err.message); });
    }

    // ── Keyboard shortcuts ──
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); downloadAll(); }
      if (e.key === 'Escape') { closeUpload(); closeVideoUpload(); document.getElementById('confirmOverlay').classList.remove('active'); }
    });

    // ── Utilities ──
    function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>
